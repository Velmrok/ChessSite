realm: chess
enabled: true
registrationAllowed: true
loginWithEmailAllowed: true
sslRequired: external

roles:
  realm:
    - name: admin
      description: Chess platform administrator

clients:
  - clientId: chess-frontend
    enabled: true
    publicClient: false
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    frontchannelLogout: true
    attributes:
      pkce.code.challenge.method: S256 
    redirectUris:
      - "$(env:APP_BASE_URL)/api/signin-oidc"
      - "$(env:APP_BASE_URL)/api/signout-oidc"
    webOrigins:
      - "$(env:APP_BASE_URL)"
    protocolMappers:
      - name: chess-frontend-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: chess-frontend
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"
          userinfo.token.claim: "false"
      - name: realm-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-realm-role-mapper
        config:
          multivalued: "true"
          claim.name: "roles"
          jsonType.label: "String"
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
    secret: "$(env:KC_FRONTEND_SECRET)"

  - clientId: chess-backend-admin
    enabled: true
    publicClient: false
    serviceAccountsEnabled: true
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    secret: "$(env:KC_ADMIN_CLIENT_SECRET)"

users:
  - username: chessadmin
    enabled: true
    email: chessadmin@chess.local
    emailVerified: true
    firstName: Chess
    lastName: Admin
    credentials:
      - type: password
        value: admin123
        temporary: false
    realmRoles:
      - admin

  - username: service-account-chess-backend-admin
    enabled: true
    serviceAccountClientId: chess-backend-admin
    clientRoles:
      realm-management:
        - manage-users