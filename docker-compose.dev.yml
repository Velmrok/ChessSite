secrets:
  db_password:
    file: ./.secrets/db_password.txt

  
services:
  db:
    image: postgres:15
    container_name: chess_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: chess_backend
    working_dir: /app
    ports:
      - "5062:5062"
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
      - dotnet_packages:/root/.nuget/packages
      - ./backend/wwwroot/uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5062
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - Storage__Provider=Local
      - ConnectionStrings__Host=db
      - ConnectionStrings__Database=${POSTGRES_DB}
      - ConnectionStrings__Username=${POSTGRES_USER}
    secrets:
      - db_password
    command: >
      sh -c "
      dotnet restore &&
      dotnet watch run --no-launch-profile
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5062/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: node:20-alpine
    container_name: chess_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: >
      sh -c "
      npm install &&
      npm run dev
      " 
    networks:
      - frontend-net

  redis:
    image: redis:7-alpine
    container_name: chess_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - backend-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: chess_keycloak
    command: start-dev 
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL_DEV}
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
          condition: service_healthy
    networks:
      - keycloak-net
      - frontend-net
      - backend-net
    restart: unless-stopped

  keycloak-db:
    container_name: chess_keycloak_db
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.0.5 
    container_name: chess_keycloak_config
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - ./keycloak:/config:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_ADMIN_USER}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      APP_BASE_URL: ${APP_BASE_URL_DEV}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
    networks:
      - keycloak-net
    restart: "no"
    
  local-chess-engine:
    image: velmrok/chess-engine:v1 #./local.Chess.Engine
    container_name: local_chess_engine
    working_dir: /app
    ports:
      - "5000:5000"
    networks:
      - backend-net
    environment:
      - DEPTH=5
      - QDEPTH=15
      - QUANTIZED=--quantized
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  dotnet_packages:
  keycloak_db_data:
networks:
  frontend-net:
  backend-net:
  keycloak-net:
    
